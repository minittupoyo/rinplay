name: Release

# タグ(v0.1.0 など)を push すると、署名つき APK をビルドして、GitHub Release に添付する。
# 手動実行(workflow_dispatch)では、ビルドして artifact に置くだけで、Release は作らない。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # SDK のライセンスに同意する(パッケージは入れない。既定の tools は、ランナーの cmdline-tools にない)。
      # 不足するコンポーネント(プラットフォーム、NDK、CMake)は Gradle が取得する。
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RINPLAY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RINPLAY_KEYSTORE_BASE64 が設定されていません"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rinplay-release.jks"

      - name: Build release APK
        env:
          RINPLAY_KEYSTORE: ${{ runner.temp }}/rinplay-release.jks
          RINPLAY_KEYSTORE_PASSWORD: ${{ secrets.RINPLAY_KEYSTORE_PASSWORD }}
          RINPLAY_KEY_ALIAS: ${{ secrets.RINPLAY_KEY_ALIAS }}
          RINPLAY_KEY_PASSWORD: ${{ secrets.RINPLAY_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${GITHUB_RUN_NUMBER}" \
            --no-daemon --stacktrace

      - name: Verify signature and rename
        id: apk
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          OUT="RinPlay-${{ steps.version.outputs.name }}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "$OUT.sha256")" >> "$GITHUB_OUTPUT"
          echo "cert=$("$APKSIGNER" verify --print-certs "$APK" | grep 'certificate SHA-256' | head -1 | sed 's/.*: //')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## インストール

          \`${{ steps.apk.outputs.file }}\` をダウンロードしてインストールしてください(Android 8.0 以上、arm64-v8a)。

          - APK の SHA-256: \`${{ steps.apk.outputs.sha256 }}\`
          - 署名証明書の SHA-256: \`${{ steps.apk.outputs.cert }}\`

          > デバッグビルドで入れたアプリ(別の署名)の上には、上書きインストールできません。先にアンインストールしてください(設定は引き継がれません)。

          ## 変更点
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256" \
            --title "RinPlay ${{ steps.version.outputs.name }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --verify-tag
